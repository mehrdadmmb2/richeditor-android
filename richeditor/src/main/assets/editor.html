<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=980, initial-scale=1.0, minimum-scale=0.10, maximum-scale=5.0, user-scalable=yes">

    <style>
        @font-face { font-family: iransans; src: url("iransans.ttf") format("truetype"); }
        @font-face { font-family: Vazir; src: url("Vazir.ttf") format("truetype"); }
        @font-face { font-family: sahar; src: url("BSahar.ttf") format("truetype"); }
        @font-face { font-family: aseman; src: url("Aseman.ttf") format("truetype"); }
        @font-face { font-family: BYekan; src: url("BYekan.ttf") format("truetype"); }
        @font-face { font-family: BBadr; src: url("BBadr.ttf") format("truetype"); }
        @font-face { font-family: BTitr; src: url("BTitr.ttf") format("truetype"); }
        @font-face { font-family: Shabnam; src: url("Shabnam.ttf") format("truetype"); }
        @font-face { font-family: BNazanin; src: url("BNazanin.ttf") format("truetype"); }
        @font-face { font-family: BMitra; src: url("BMitra.TTF") format("truetype"); }
        @font-face { font-family: segoeui; src: url("segoeui.ttf") format("truetype"); }
        @font-face { font-family: besm; src: url("besm.ttf") format("truetype"); }
        @font-face { font-family: Lalezar-Regular; src: url("Lalezar-Regular.ttf") format("truetype"); }
        @font-face { font-family: IranNastaliq; src: url("IranNastaliq.ttf") format("truetype"); }
        @font-face { font-family: Far_Homa; src: url("Far_Homa.ttf") format("truetype"); }
        @font-face { font-family: badkhat; src: url("badkhat.ttf") format("truetype"); }
        @font-face { font-family: Tabssom; src: url("Tabssom.ttf") format("truetype"); }
        @font-face { font-family: AFSANEH; src: url("AFSANEH.ttf") format("truetype"); }
        @font-face { font-family: Morvarid; src: url("Morvarid.ttf") format("truetype"); }
        @font-face { font-family: zangar; src: url("zangar.ttf") format("truetype"); }
        @font-face { font-family: Kamran; src: url("Kamran.ttf") format("truetype"); }

        :root {
             --re-page-width: 794px;
             --re-page-height: 1123px;

            --re-page-margin-top: 96px;
            --re-page-margin-right: 72px;
            --re-page-margin-bottom: 96px;
            --re-page-margin-left: 72px;
            --re-page-gap: 24px;
            --re-body-bg: #F0F0F0;
            --re-page-bg: #ffffff;
            --re-text-color: #111111;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--re-body-bg);
            color: var(--re-text-color);
            font-family: sans-serif;
            font-size: 16px;
            line-height: 1.5;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-width: calc(var(--re-page-width) + 80px);
        }

        #page-container {
            width: var(--re-page-width);
            margin: 24px auto;
            padding-bottom: 24px;
            transform-origin: top center;
        }

        .re-page {
            width: var(--re-page-width);
            height: var(--re-page-height);
            min-height: var(--re-page-height);
            max-height: var(--re-page-height);
            box-sizing: border-box;
            margin: 0 auto var(--re-page-gap) auto;
            padding:
                var(--re-page-margin-top)
                var(--re-page-margin-right)
                var(--re-page-margin-bottom)
                var(--re-page-margin-left);
            background: var(--re-page-bg);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
            overflow: hidden;
            position: relative;
            page-break-after: always;
            break-after: page;
            /* Tells the browser that editing/laying out one page can't
               affect the layout or paint of its siblings. On a long,
               multi-page document this keeps the forced reflows that
               pagination triggers (scrollHeight/clientHeight reads)
               scoped to the page being edited instead of the whole
               document, which matters a lot on mobile GPUs/CPUs. */
            contain: layout style;
        }

        .re-page-content {
            width: 100%;
            height: 100%;
            max-height: 100%;
            box-sizing: border-box;
            outline: none;
            overflow: hidden;
            white-space: normal;
            word-break: normal;
            overflow-wrap: normal;
            hyphens: none;
            line-break: auto;
            direction: inherit;

        }

        .re-page-content[contenteditable="false"] {
            cursor: default;
        }

        .re-page-content:empty:before {
            content: attr(placeholder);
            color: #999999;
            pointer-events: none;
        }

        .re-page-content img {
            max-width: 100%;
            height: auto;
        }

        .re-page-content table {
            max-width: 100%;
            border-collapse: collapse;
        }

        .re-page-content td,
        .re-page-content th {
            border: 1px solid #888888;
            padding: 4px;
        }

        .re-page-content p,
        .re-page-content > div {
            margin: 0 0 8px 0;
        }

        .re-page-content h1,
        .re-page-content h2,
        .re-page-content h3,
        .re-page-content h4,
        .re-page-content h5,
        .re-page-content h6 {
            margin-top: .6em;
            margin-bottom: .4em;
        }

        .re-page-content blockquote {
            border-left: 4px solid #cccccc;
            margin: 8px 0;
            padding-left: 12px;
            color: #555555;
        }

        body.dark-mode {
            --re-body-bg: #202124;
            --re-page-bg: #2b2c2f;
            --re-text-color: #eeeeee;
        }

        body.dark-mode .re-page {
            box-shadow: 0 2px 12px rgba(0, 0, 0, .65);
        }

        .re-img-resize-wrapper {
            display: inline-block;
            position: relative;
            outline: 2px solid #4A90D9;
            outline-offset: 2px;
            cursor: default;
            max-width: 100%;
        }

        .re-img-resize-wrapper img {
            display: block;
            pointer-events: none;
        }

        .re-img-resize-handle {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #4A90D9;
            border: 2px solid #ffffff;
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }

        .re-img-resize-handle-tl { top: -12px; left: -12px; cursor: nw-resize; }
        .re-img-resize-handle-tr { top: -12px; right: -12px; cursor: ne-resize; }
        .re-img-resize-handle-bl { bottom: -12px; left: -12px; cursor: sw-resize; }
        .re-img-resize-handle-br { bottom: -12px; right: -12px; cursor: se-resize; }

        .re-page[data-pb-style]::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
        }

        .re-page[data-pb-style="simple"]::after {
            border: var(--pb-width, 3px) solid var(--pb-color, #000000);
        }

        .re-page[data-pb-style="double"]::after {
            border: var(--pb-width, 3px) double var(--pb-color, #000000);
        }

        .re-page[data-pb-style="dashed"]::after {
            border: var(--pb-width, 3px) dashed var(--pb-color, #000000);
        }

        .re-page[data-pb-style="dotted"]::after {
            border: var(--pb-width, 3px) dotted var(--pb-color, #000000);
        }

        .re-page[data-pb-style="shadow"]::after {
            box-shadow: inset 0 0 calc(var(--pb-width, 3px) * 4) calc(var(--pb-width, 3px) * -0.5) var(--pb-color, #000000);
            border: 1px solid var(--pb-color, #000000);
        }

        .re-page[data-pb-style="thick-simple"]::after {
            border: calc(var(--pb-width, 3px) * 2) solid var(--pb-color, #000000);
            margin: 4px;
        }

        .re-page[data-pb-style="inset"]::after {
            border: var(--pb-width, 3px) inset var(--pb-color, #888888);
        }

        .re-page[data-pb-style="outset"]::after {
            border: var(--pb-width, 3px) outset var(--pb-color, #888888);
        }

        .re-page[data-pb-style="groove"]::after {
            border: var(--pb-width, 3px) groove var(--pb-color, #888888);
        }

        .re-page[data-pb-style="ridge"]::after {
            border: var(--pb-width, 3px) ridge var(--pb-color, #888888);
        }

        .re-page[data-pb-style="decorative"]::after {
            border: 2px solid var(--pb-color, #000000);
            box-shadow: inset 0 0 0 calc(var(--pb-width, 3px) + 2px) var(--pb-color, #000000),
                        inset 0 0 0 calc(var(--pb-width, 3px) + 5px) var(--re-page-bg, #ffffff);
        }

        @page {
             size: 794px 1123px;
            margin: 0;
        }

        @media print {
            html,
            body {
                width: var(--re-page-width) !important;
                min-width: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                overflow: visible !important;
            }

            #page-container {
                width: var(--re-page-width) !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .re-page {
                width: var(--re-page-width) !important;
                height: var(--re-page-height) !important;
                min-height: var(--re-page-height) !important;
                max-height: var(--re-page-height) !important;
                margin: 0 !important;
                box-shadow: none !important;
                page-break-after: always;
                break-after: page;
            }

            .re-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
</head>

<body>
<div id="page-container"></div>
<script src="rich_editor.js"></script>
</body>
</html>
